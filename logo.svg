<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Emerald Luxury Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Background -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#emeraldGrad)" filter="url(#softShadow)" />

  <!-- Gold Ring Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />

  <!-- Inner Soft Glow -->
  <rect x="30" y="30" width="452" height="452" rx="106" fill="url(#innerGlow)" />

  <!-- Decorative Inner Circle -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Central Symbol: Natural Oil Droplet + Herbal Leaf Fusion -->
  <g id="emblem" transform="translate(0, -10)">
    <!-- Golden Oil Droplet Base -->
    <path d="M 256 100 C 256 100 145 255 145 330 C 145 391 195 440 256 440 C 317 440 367 391 367 330 C 367 255 256 100 256 100 Z" 
          fill="url(#goldGrad)" 
          filter="url(#softShadow)" />

    <!-- Inner Emerald Heart of the Droplet -->
    <path d="M 256 140 C 256 140 165 268 165 330 C 165 380 206 420 256 420 C 306 420 347 380 347 330 C 347 268 256 140 256 140 Z" 
          fill="#064e3b" 
          opacity="0.92" />

    <!-- Botanical Leaf Flourish (Sprouting inside the droplet) -->
    <!-- Center Vein & Main Herbal Leaf -->
    <path d="M 256 185 C 230 240 200 300 200 350 C 200 380 225 400 256 400 C 287 400 312 380 312 350 C 312 300 282 240 256 185 Z" 
          fill="url(#goldGrad)" />

    <!-- Left Leaf Petal -->
    <path d="M 256 310 C 220 280 185 300 180 340 C 180 365 210 375 256 335 Z" 
          fill="url(#goldGrad)" 
          opacity="0.85" />

    <!-- Right Leaf Petal -->
    <path d="M 256 270 C 290 240 325 260 330 295 C 330 325 300 335 256 295 Z" 
          fill="url(#goldGrad)" 
          opacity="0.85" />

    <!-- Central Stem Line -->
    <path d="M 256 200 Q 256 320 256 390" 
          stroke="#064e3b" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Golden Sparkles / Stars -->
    <!-- Top Right Sparkle -->
    <path d="M 370 150 Q 385 150 385 135 Q 385 150 400 150 Q 385 150 385 165 Q 385 150 370 150 Z" 
          fill="url(#goldGrad)" />
    <!-- Bottom Left Sparkle -->
    <path d="M 115 350 Q 127 350 127 338 Q 127 350 139 350 Q 127 350 127 362 Q 127 350 115 350 Z" 
          fill="url(#goldGrad)" />
    <!-- Small Star -->
    <circle cx="140" cy="190" r="4.5" fill="#fef3c7" />
    <circle cx="375" cy="360" r="5" fill="#fef3c7" />
  </g>
</svg>
